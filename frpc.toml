serverAddr = "hayabusa.proxy.rlwy.net"
serverPort = 26126

auth.method = "token"
auth.token = "CHANGE_ME_TO_YOUR_SECRET_TOKEN"

log.to = "console"
log.level = "info"

# ---- Web 服务 (localhost:3000) ----
# 外部通过 HTTP CONNECT 代理访问:
#   curl -x hayabusa.proxy.rlwy.net:26126 http://web-tunnel/
[[proxies]]
name = "web"
type = "tcpmux"
multiplexer = "httpconnect"
localIP = "127.0.0.1"
localPort = 3000
customDomains = ["web-tunnel"]

# ---- RDP 服务 (localhost:3389) ----
# 外部通过 HTTP CONNECT 代理访问 rdp-tunnel
[[proxies]]
name = "rdp"
type = "tcpmux"
multiplexer = "httpconnect"
localIP = "127.0.0.1"
localPort = 3389
customDomains = ["rdp-tunnel"]
