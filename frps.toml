bindPort = 7000
# kcpBindPort = 7000           # 可选: KCP 加速 (UDP)

auth.method = "token"
auth.token = "CHANGE_ME_TO_YOUR_SECRET_TOKEN"

# 限制 frps 只能分配以下端口用于代理隧道
allowPorts = [
  { start = 13389, end = 13389 },
  { start = 13000, end = 13000 },
]

